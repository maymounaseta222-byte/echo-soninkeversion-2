name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generer le projet Android
        run: flutter create . --platforms=android --org com.soninke --project-name soninke_echo
      - name: Permissions, micro et nom de l'appli
        run: python3 tools/setup_android.py
      - run: flutter pub get
      - name: Icone de l'appli
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: soninke-echo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
